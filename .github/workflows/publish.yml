name: publish

# Publishing happens on a version tag, a published GitHub Release, or a manual
# run with publish ticked. Nothing publishes on a plain push to main, so main can
# move without minting versions.
#
# npm rejects republishing a version that already exists, so the version in
# package.json is the real gate on what goes out.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (off = pack and verify only)'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: the workflow exchanges an OIDC token for a
      # signed attestation linking the tarball to this commit and workflow.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer, and Node 22 ships
      # 10.9.x. Without this the publish step fails with an auth error that does
      # not obviously point at the npm version.
      - name: Use an npm new enough for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci || npm install

      - run: npm run typecheck

      # Builds first, then runs the suite against the built artifact.
      - run: npm test

      # A release tagged v1.2.3 must contain version 1.2.3. Without this, a
      # forgotten version bump silently republishes the previous version and
      # fails halfway through, or worse, publishes something mislabelled.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag v$TAG does not match package.json version $PKG."
            exit 1
          fi

      # The whole point of the library is that it never talks to the network.
      # scripts/build.mjs already fails on a hit and integration.test.mjs asserts
      # it too, but this is the last gate before bytes reach the registry.
      - name: Re-assert the no-network guarantee on the tarball
        run: |
          npm pack
          tar -xzf superandom-*.tgz
          for api in fetch XMLHttpRequest WebSocket EventSource sendBeacon geolocation RTCPeerConnection; do
            if grep -q "$api" package/build/index.mjs package/build/superandom-*.js; then
              echo "::error::Tarball references $api. Refusing to publish."
              exit 1
            fi
          done
          echo "Tarball is clean."

      - name: Show what would be published
        run: npm pack --dry-run

      # Authenticated by npm trusted publishing: the id-token permission above
      # lets npm exchange a GitHub OIDC token for a short-lived publish
      # credential, so there is no NPM_TOKEN secret to leak or rotate. The
      # trusted publisher is configured on npmjs.com against this repository and
      # this filename, so renaming this file breaks publishing until npm is
      # updated to match.
      #
      # Provenance is on here, unlike the manual 1.0.0 publish, because it needs
      # exactly this OIDC token to sign the attestation.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: npm publish --provenance --access public
